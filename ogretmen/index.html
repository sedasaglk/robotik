<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Robotics Lab — Öğretmen paneli</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7fb; --fg: #111827; --muted: #4b5563; --accent: #0e7490; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1420; --fg: #e5e7eb; --muted: #9ca3af; --accent: #67d4ea; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
    color: var(--fg); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: .5rem 0; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Robotics Lab — Öğretmen paneli</h1>
  <p id="message" role="status">Açılıyor…</p>
  <p id="manual" hidden><a id="link" href="#">Açılmazsa buraya tıkla</a></p>
  <noscript><p>Bu sayfa için tarayıcıda JavaScript açık olmalı.</p></noscript>
</main>
<script>
  (function () {
    var message = document.getElementById('message');
    function say(text) { message.textContent = text; }
    fetch("../target.json" + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error(); return response.json(); })
      .then(function (target) {
        var address = target && target.open ? target["teacher"] : null;
        if (typeof address !== 'string' || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\//.test(address)) {
          say('Ders şu an kapalı. Öğretmenin açınca bu sayfayı yenile.');
          return;
        }
        var link = document.getElementById('link');
        link.href = address;
        document.getElementById('manual').hidden = false;
        window.location.replace(address);
      })
      .catch(function () { say('Adres okunamadı. İnternet bağlantını kontrol edip sayfayı yenile.'); });
  })();
</script>
</body>
</html>
